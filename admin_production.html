<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🌿 Production CBD — AJCV</title>
<style>
:root{
  --navy:#0D1B4B; --navy2:#1A2B5F; --gold:#FFB300; --gold2:#FFC933;
  --dark:#080F28; --surface:#111827; --surface2:#1F2937;
  --green:#22C55E; --red:#EF4444; --blue:#3B82F6; --orange:#F97316; --purple:#A855F7;
  --text:#F9FAFB; --text2:#9CA3AF; --text3:#6B7280; --border:rgba(255,255,255,0.08);
  --r:14px; --rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--dark);color:var(--text);-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-weight:700}
.muted{color:var(--text2)}
.small{font-size:12px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* ── Bannière test ── */
#test-banner{position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--purple);color:#fff;font:600 13px/1.4 Arial,sans-serif;text-align:center;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.35)}

/* ── Login ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px 24px;width:100%;max-width:380px}
.login-card .logo{font-size:26px;font-weight:800;text-align:center;margin-bottom:4px}
.login-card .logo span{color:var(--green)}
.login-card .sub{text-align:center;color:var(--text2);font-size:13px;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin:12px 0 5px}
.fld{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface2);color:var(--text);font-size:15px}
.fld:focus{outline:none;border-color:var(--green)}
.btn{padding:12px 18px;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;background:var(--green);color:#06231a}
.btn:active{transform:scale(.98)}
.btn-block{width:100%;margin-top:18px}
.btn-gold{background:var(--gold);color:#1a1300}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:7px 12px;font-size:13px;font-weight:600}
.btn-icon{background:transparent;border:none;font-size:16px;padding:4px 6px}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px;text-align:center}

/* ── App shell ── */
#app{max-width:1100px;margin:0 auto;padding:14px 14px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.topbar .brand{font-size:18px;font-weight:800}
.topbar .brand span{color:var(--green)}
.who{font-size:12px;color:var(--text2);text-align:right;line-height:1.3}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:13px;font-weight:600;white-space:nowrap}
.tab.active{background:var(--green);color:#06231a;border-color:var(--green)}

/* ── Cards / tables / kpi ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row .col{flex:1 1 150px;min-width:130px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:6px}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:12px}
.kpi-v{font-size:24px;font-weight:800}
.kpi-l{font-size:11px;color:var(--text2);margin-top:3px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
td .qin{width:70px;padding:6px;text-align:center;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.b-urgent{background:rgba(239,68,68,.18);color:#fca5a5}
.b-aprod{background:rgba(249,115,22,.18);color:#fdba74}
.b-ok{background:rgba(34,197,94,.18);color:#86efac}
.loading{text-align:center;color:var(--text2);padding:24px}
.empty{text-align:center;color:var(--text3);padding:18px}

/* ── Toast ── */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:10000;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9998}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.modal h3{font-size:16px;margin-bottom:14px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="logo">🌿 <span>Production</span> CBD</div>
    <div class="sub">AJCV — conditionnement</div>
    <label for="li-login">Identifiant</label>
    <input id="li-login" class="fld" autocapitalize="characters" autocomplete="username" placeholder="IDENTIFIANT">
    <label for="li-mdp">Mot de passe</label>
    <input id="li-mdp" class="fld" type="password" autocomplete="current-password" placeholder="••••••••">
    <label style="display:flex;align-items:center;gap:8px;margin-top:14px;cursor:pointer;font-weight:500;color:var(--text)"><input type="checkbox" id="li-remember" checked style="width:18px;height:18px"> Se souvenir de moi</label>
    <button class="btn btn-block" id="li-btn">Se connecter</button>
    <div class="err" id="li-err"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand">🌿 <span>Production</span> CBD</div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="who" id="who"></div>
      <button class="btn-ghost btn-sm" id="pwd" title="Changer mon mot de passe">🔑</button>
      <button class="btn-ghost btn-sm" id="logout">Quitter</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════
// MODE TEST — backend de test, données fictives.
// ════════════════════════════════════════════════════════════
const IS_TEST  = true;
const API_BASE = 'https://ajcvbackend-test-production.up.railway.app';
if (IS_TEST) {
  const b = document.createElement('div');
  b.id = 'test-banner';
  b.textContent = '🧪 ENVIRONNEMENT DE TEST · Production CBD — données fictives, sans impact prod';
  document.addEventListener('DOMContentLoaded', () => { document.body.appendChild(b); document.body.style.paddingTop = '32px'; });
}
const API = API_BASE;

// ── État ──
const S = { token:'', user:null, mode:'', config:null, tab:'' };
const SESSION_KEY='ajcv_cbd_session', LOGIN_KEY='ajcv_cbd_login', REMEMBER_KEY='ajcv_cbd_remember';
function saveSession(remember){
  const payload = JSON.stringify({ token:S.token, user:S.user });
  try {
    if (remember){ localStorage.setItem(SESSION_KEY, payload); sessionStorage.removeItem(SESSION_KEY); }
    else { sessionStorage.setItem(SESSION_KEY, payload); localStorage.removeItem(SESSION_KEY); }
  } catch(_){}
}
function lireSession(){ try { return localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY); } catch(_){ return null; } }
function effacerSession(){ try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch(_){} }
function prefillLogin(){
  try {
    const l=localStorage.getItem(LOGIN_KEY); if(l && $('li-login')) $('li-login').value=l;
    if($('li-remember')) $('li-remember').checked = (localStorage.getItem(REMEMBER_KEY)!=='0');
  } catch(_){}
}

// ── Helpers ──
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const num = (v,d=0) => { const n=parseFloat(v); return isNaN(n)?d:n; };
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

async function api(method, path, body){
  const opts = { method, headers:{ 'Authorization':'Bearer '+S.token } };
  if (body){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  let r;
  try { r = await fetch(API+path, opts); }
  catch(e){ return { error:'Réseau indisponible' }; }
  if (r.status===401){ deconnexion(true); return { error:'Session expirée' }; }
  let data = {};
  try { data = await r.json(); } catch(_){ data = {}; }
  if (!r.ok && !data.error) data.error = 'Erreur '+r.status;
  data._status = r.status;
  return data;
}

// ════════════════════════════════════════════════════════════
// CONNEXION
// ════════════════════════════════════════════════════════════
$('li-btn').onclick = connexion;
$('li-mdp').addEventListener('keydown', e => { if(e.key==='Enter') connexion(); });
$('li-login').addEventListener('keydown', e => { if(e.key==='Enter') $('li-mdp').focus(); });

async function connexion(){
  const login = $('li-login').value.trim();
  const mdp = $('li-mdp').value;
  if (!login || !mdp){ $('li-err').textContent='Identifiant et mot de passe requis'; return; }
  $('li-err').textContent=''; $('li-btn').textContent='Connexion…'; $('li-btn').disabled=true;
  let res;
  try { res = await (await fetch(API+'/auth/login',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({login, mdp}) })).json(); }
  catch(e){ res = { error:'Réseau indisponible' }; }
  $('li-btn').textContent='Se connecter'; $('li-btn').disabled=false;
  if (!res || res.error || !res.token){ $('li-err').textContent = (res&&res.error) || 'Identifiant ou mot de passe incorrect'; return; }
  S.token = res.token; S.user = res;
  // Vérifier l'accès Production (cbdAccess) + charger la config
  const cfg = await api('GET','/cbd/config');
  if (cfg.error){
    S.token=''; S.user=null;
    if (cfg._status===404)      $('li-err').textContent = 'Module Production absent du backend (route /cbd manquante). Le bloc cbd_backend.js doit être déployé sur le backend test.';
    else if (cfg._status===403) $('li-err').textContent = "Ce compte n'a pas accès au module Production.";
    else                        $('li-err').textContent = 'Production indisponible : '+(cfg.error||'erreur');
    return;
  }
  S.config = cfg.config || {};
  S.mode = ['Admin','Depot'].includes(res.role) ? 'responsable' : 'preparateur';
  const remember = $('li-remember') ? $('li-remember').checked : true;
  try { localStorage.setItem(LOGIN_KEY, login); localStorage.setItem(REMEMBER_KEY, remember?'1':'0'); } catch(_){}
  saveSession(remember);
  demarrer();
}

function deconnexion(expired){
  S.token=''; S.user=null; S.mode=''; S.config=null;
  effacerSession();
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  prefillLogin(); $('li-mdp').value='';
  if (expired) $('li-err').textContent='Session expirée, reconnecte-toi.';
}
$('logout').onclick = ()=>deconnexion(false);
$('pwd').onclick = formMotDePasse;

// Reprise de session
(async function reprise(){
  prefillLogin();
  let s=null; try { s=JSON.parse(lireSession()||'null'); } catch(_){}
  if (s && s.token){
    S.token=s.token; S.user=s.user;
    const cfg = await api('GET','/cbd/config');
    if (!cfg.error){ S.config=cfg.config||{}; S.mode=['Admin','Depot'].includes(s.user.role)?'responsable':'preparateur'; demarrer(); }
    else { deconnexion(false); }
  }
})();

// ════════════════════════════════════════════════════════════
// DÉMARRAGE + NAVIGATION (role-aware)
// ════════════════════════════════════════════════════════════
function demarrer(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  const u=S.user;
  $('who').innerHTML = esc((u.prenom||'')+' '+(u.nom||'')).trim() + '<br>' + (S.mode==='responsable'?'Responsable':'Préparateur');
  construireTabs();
  ouvrir(TABS[0].id);
}

// Onglets disponibles selon le rôle (Partie 1 ; le reste arrive aux parties 2-3)
let TABS = [];
function construireTabs(){
  if (S.mode==='responsable'){
    TABS = [
      { id:'stock',    label:'📋 Stock du jour', render:renderStock },
      { id:'saisie',   label:'➕ Saisie',        render:renderSaisie },
      { id:'ateliers', label:'🏭 Ateliers',      render:renderAteliers },
    ];
  } else {
    TABS = [
      { id:'saisie', label:'➕ Saisie',        render:renderSaisie },
      { id:'stock',  label:'📋 Stock du jour', render:renderStock },
    ];
  }
  const t=$('tabs'); t.innerHTML='';
  TABS.forEach(tb=>{
    const b=document.createElement('button'); b.className='tab'; b.textContent=tb.label; b.dataset.id=tb.id;
    b.onclick=()=>ouvrir(tb.id); t.appendChild(b);
  });
}
function ouvrir(id){
  const tb=TABS.find(x=>x.id===id); if(!tb) return;
  S.tab=id;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  $('content').innerHTML='<div class="loading">Chargement…</div>';
  tb.render();
}

// Libellés de priorité (paramétrables via cbd_config.priorite_labels)
function prioLabel(p){
  const def={ urgent:'Urgent', a_produire:'À produire', ok:'OK' };
  const lib=(S.config&&S.config.priorite_labels)||{};
  return lib[p]||def[p]||p||'';
}
function prioBadge(p){
  if(!p) return '<span class="muted">—</span>';
  const cls={urgent:'b-urgent',a_produire:'b-aprod',ok:'b-ok'}[p]||'';
  const ico={urgent:'🔴',a_produire:'🟠',ok:'✅'}[p]||'';
  return `<span class="badge ${cls}">${ico} ${esc(prioLabel(p))}</span>`;
}

// ════════════════════════════════════════════════════════════
// ÉCRAN — STOCK DU JOUR
// ════════════════════════════════════════════════════════════
let _stockDate = todayISO();
async function renderStock(){
  const resp = S.mode==='responsable';
  $('content').innerHTML = `
    <div class="card">
      <h3>📋 Stock du jour
        <span class="row" style="gap:8px">
          <input type="date" id="st-date" class="fld" style="width:auto;padding:8px 10px" value="${_stockDate}">
          <button class="btn-ghost btn-sm" id="st-refresh">🔄</button>
        </span>
      </h3>
      <div class="kpis" id="st-kpis"></div>
      <div id="st-body"><div class="loading">Chargement…</div></div>
      ${resp?'<div class="small muted" style="margin-top:8px">Saisis le comptage du matin ➜ « à produire » et priorités se calculent tout seuls. Le relevé Odoo est optionnel (écart affiché).</div>':''}
    </div>`;
  $('st-date').onchange = e => { _stockDate=e.target.value; chargerStock(); };
  $('st-refresh').onclick = chargerStock;
  chargerStock();
}
async function chargerStock(){
  const resp = S.mode==='responsable';
  const body=$('st-body'); body.innerHTML='<div class="loading">Chargement…</div>';
  const d = await api('GET','/cbd/stock-jour?date='+_stockDate);
  if (d.error){ body.innerHTML='<div class="empty">❌ '+esc(d.error)+'</div>'; return; }
  const lignes = d.lignes||[];
  // KPI
  let nbUrgent=0, aProdTot=0, prodTot=0;
  lignes.forEach(l=>{ if(l.priorite==='urgent')nbUrgent++; aProdTot+=(l.a_produire||0); prodTot+=(l.produit_auj||0); });
  $('st-kpis').innerHTML = `
    <div class="kpi"><div class="kpi-v">${lignes.length}</div><div class="kpi-l">Références</div></div>
    <div class="kpi"><div class="kpi-v" style="color:var(--red)">${nbUrgent}</div><div class="kpi-l">🔴 Urgent</div></div>
    <div class="kpi"><div class="kpi-v" style="color:var(--orange)">${aProdTot}</div><div class="kpi-l">À produire</div></div>
    <div class="kpi"><div class="kpi-v" style="color:var(--green)">${prodTot}</div><div class="kpi-l">Produit aujourd'hui</div></div>`;
  if (!lignes.length){ body.innerHTML='<div class="empty">Aucun produit actif. Ajoute des produits dans le référentiel (Partie 2).</div>'; return; }
  const head = `<tr><th>Réf.</th><th>Variété</th><th>Format</th><th>Compté</th><th>Cible</th><th>À produire</th><th>Priorité</th><th>Produit</th><th>Reste</th>${resp?'<th>Relevé Odoo</th><th>Écart</th><th></th>':''}</tr>`;
  const rows = lignes.map(l=>{
    const compte = l.stock_compte!=null?l.stock_compte:'';
    const releve = l.releve_odoo!=null?l.releve_odoo:'';
    const ecart = l.ecart_odoo!=null ? (l.ecart_odoo>0?'+':'')+l.ecart_odoo : '—';
    if (resp){
      return `<tr data-pid="${l.produit_id}">
        <td><b>${esc(l.code||'')}</b><br><span class="small muted">${esc(l.designation||'')}</span></td>
        <td>${esc(l.variete_nom||'—')}</td>
        <td>${l.format_g!=null?l.format_g+' g':'—'}</td>
        <td><input class="qin st-compte" type="number" min="0" inputmode="numeric" value="${compte}"></td>
        <td>${l.stock_cible||0}</td>
        <td><b>${l.a_produire!=null?l.a_produire:'—'}</b></td>
        <td>${prioBadge(l.priorite)}</td>
        <td>${l.produit_auj||0}</td>
        <td>${l.reste!=null?l.reste:'—'}</td>
        <td><input class="qin st-releve" type="number" min="0" inputmode="numeric" value="${releve}"></td>
        <td>${ecart}</td>
        <td><button class="btn btn-sm st-save">💾</button></td>
      </tr>`;
    }
    return `<tr>
      <td><b>${esc(l.code||'')}</b><br><span class="small muted">${esc(l.designation||'')}</span></td>
      <td>${esc(l.variete_nom||'—')}</td>
      <td>${l.format_g!=null?l.format_g+' g':'—'}</td>
      <td>${l.stock_compte!=null?l.stock_compte:'—'}</td>
      <td>${l.stock_cible||0}</td>
      <td><b>${l.a_produire!=null?l.a_produire:'—'}</b></td>
      <td>${prioBadge(l.priorite)}</td>
      <td>${l.produit_auj||0}</td>
      <td>${l.reste!=null?l.reste:'—'}</td>
    </tr>`;
  }).join('');
  body.innerHTML = `<div class="table-wrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  if (resp){
    body.querySelectorAll('.st-save').forEach(btn=>{
      btn.onclick = async ()=>{
        const tr=btn.closest('tr'); const pid=tr.dataset.pid;
        const compte=tr.querySelector('.st-compte').value;
        const releve=tr.querySelector('.st-releve').value;
        btn.textContent='…'; btn.disabled=true;
        const r=await api('POST','/cbd/stock-jour',{ produit_id:pid, date_jour:_stockDate, stock_compte:compte===''?0:num(compte), releve_odoo:releve===''?null:num(releve) });
        btn.disabled=false; btn.textContent='💾';
        if (r.error){ toast('❌ '+r.error); return; }
        toast('✅ Comptage enregistré'); chargerStock();
      };
    });
  }
}

// ════════════════════════════════════════════════════════════
// ÉCRAN — SAISIE PRODUCTION (avec atelier)
// ════════════════════════════════════════════════════════════
let _saisieRefs = null; // { ateliers, produits, receptions }
async function renderSaisie(){
  $('content').innerHTML = `
    <div class="card">
      <h3>➕ Nouvelle production</h3>
      <div id="sa-form"><div class="loading">Chargement…</div></div>
    </div>
    <div class="card">
      <h3>📦 Productions du jour <button class="btn-ghost btn-sm" id="sa-refresh">🔄</button></h3>
      <div id="sa-list"><div class="loading">Chargement…</div></div>
    </div>`;
  $('sa-refresh').onclick = chargerProductionsJour;
  const [a,p,r] = await Promise.all([ api('GET','/cbd/ateliers'), api('GET','/cbd/produits'), api('GET','/cbd/receptions') ]);
  _saisieRefs = {
    ateliers: (a.ateliers||[]).filter(x=>x.actif!==false),
    produits: (p.produits||p||[]).filter(x=>x.actif!==false),
    receptions: (r.receptions||r||[])
  };
  rendreFormSaisie();
  chargerProductionsJour();
}
function rendreFormSaisie(){
  const refs=_saisieRefs;
  const optsAtelier = refs.ateliers.map(a=>`<option value="${a.id}" data-vrac="${a.consomme_vrac?1:0}" data-unite="${esc(a.unite||'')}">${esc(a.nom)}${a.unite?' ('+esc(a.unite)+')':''}</option>`).join('');
  const optsProduit = refs.produits.map(p=>`<option value="${p.id}">${esc(p.code||'')} — ${esc(p.designation||'')}</option>`).join('');
  const optsRecep   = `<option value="">— aucune —</option>`+refs.receptions.map(r=>{
    const rest = (r.vrac_restant_kg!=null)?(' · reste '+r.vrac_restant_kg+' kg'):'';
    return `<option value="${r.id}">${esc(r.lot_vrac||'')}${esc(rest)}</option>`;
  }).join('');
  const f=$('sa-form');
  if (!refs.ateliers.length){ f.innerHTML='<div class="empty">Aucun atelier actif. Crée-les dans l\'onglet 🏭 Ateliers.</div>'; return; }
  if (!refs.produits.length){ f.innerHTML='<div class="empty">Aucun produit. Ajoute des produits dans le référentiel (Partie 2).</div>'; return; }
  f.innerHTML = `
    <div class="row">
      <div class="col"><label>Atelier</label><select id="sa-atelier" class="fld">${optsAtelier}</select></div>
      <div class="col"><label>Produit (pochon)</label><select id="sa-produit" class="fld">${optsProduit}</select></div>
    </div>
    <div class="row">
      <div class="col"><label>Quantité (<span id="sa-unite">unité</span>)</label><input id="sa-qte" class="fld" type="number" min="1" inputmode="numeric" placeholder="0"></div>
      <div class="col"><label>N° lot pochon (optionnel)</label><input id="sa-lot" class="fld" placeholder="ex. LP-001"></div>
    </div>
    <div class="row" id="sa-vrac-zone">
      <div class="col"><label>Lot vrac source</label><select id="sa-recep" class="fld">${optsRecep}</select></div>
      <div class="col"><label>Vrac engagé (kg)</label><input id="sa-vrac" class="fld" type="number" min="0" step="0.001" inputmode="decimal" placeholder="0"></div>
    </div>
    <div class="row">
      <div class="col"><label>Temps passé (min, optionnel)</label><input id="sa-temps" class="fld" type="number" min="0" inputmode="numeric" placeholder="ex. 30"></div>
      <div class="col"><label>Date</label><input id="sa-date" class="fld" type="date" value="${todayISO()}"></div>
    </div>
    <button class="btn btn-block" id="sa-submit">✅ Enregistrer la production</button>`;
  const majVrac = ()=>{
    const sel=$('sa-atelier').selectedOptions[0];
    const vrac = sel && sel.dataset.vrac==='1';
    $('sa-vrac-zone').style.display = vrac?'flex':'none';
    $('sa-unite').textContent = (sel&&sel.dataset.unite)||'unité';
  };
  $('sa-atelier').onchange = majVrac; majVrac();
  $('sa-submit').onclick = soumettreProduction;
}
async function soumettreProduction(){
  const atelier_id=$('sa-atelier').value, produit_id=$('sa-produit').value;
  const quantite=$('sa-qte').value;
  if (!quantite || num(quantite)<=0){ toast('❌ Quantité invalide'); return; }
  const sel=$('sa-atelier').selectedOptions[0]; const consomme = sel && sel.dataset.vrac==='1';
  const body = {
    atelier_id, produit_id,
    quantite: num(quantite),
    lot_pochon: $('sa-lot').value.trim()||null,
    date_prod: $('sa-date').value||todayISO(),
    temps_min: $('sa-temps').value===''?null:num($('sa-temps').value),
    reception_id: consomme ? ($('sa-recep').value||null) : null,
    vrac_engage_kg: consomme ? ($('sa-vrac').value===''?null:num($('sa-vrac').value)) : null
  };
  const btn=$('sa-submit'); btn.textContent='Enregistrement…'; btn.disabled=true;
  const r=await api('POST','/cbd/productions',body);
  btn.textContent='✅ Enregistrer la production'; btn.disabled=false;
  if (r.error){ toast('❌ '+r.error); return; }
  toast('✅ Production enregistrée');
  $('sa-qte').value=''; $('sa-lot').value=''; $('sa-temps').value=''; $('sa-vrac').value='';
  chargerProductionsJour();
}
async function chargerProductionsJour(){
  const list=$('sa-list'); list.innerHTML='<div class="loading">Chargement…</div>';
  const d=await api('GET','/cbd/productions?date='+todayISO());
  if (d.error){ list.innerHTML='<div class="empty">❌ '+esc(d.error)+'</div>'; return; }
  const prods=d.productions||[];
  if (!prods.length){ list.innerHTML='<div class="empty">Aucune production saisie aujourd\'hui.</div>'; return; }
  const resp=S.mode==='responsable';
  const head=`<tr><th>Atelier</th><th>Produit</th><th>Qté</th><th>Lot</th><th>Vrac</th><th>Temps</th><th>Par</th><th></th></tr>`;
  const rows=prods.map(p=>`<tr>
    <td>${esc(p.atelier_nom||'—')}</td>
    <td><b>${esc(p.produit_code||'')}</b> ${esc(p.produit_designation||'')}</td>
    <td><b>${p.quantite}</b> ${esc(p.atelier_unite||'')}</td>
    <td>${esc(p.lot_pochon||'—')}</td>
    <td>${p.vrac_engage_kg!=null?p.vrac_engage_kg+' kg':'—'}</td>
    <td>${p.temps_min!=null?p.temps_min+' min':'—'}</td>
    <td>${esc(p.preparateur||'')}</td>
    <td>${(resp||p.preparateur===S.user.login)?`<button class="btn-icon sa-del" data-id="${p.id}" title="Supprimer">🗑️</button>`:''}</td>
  </tr>`).join('');
  list.innerHTML=`<div class="table-wrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  list.querySelectorAll('.sa-del').forEach(b=>{
    b.onclick=async ()=>{
      if(!confirm('Supprimer cette production ?')) return;
      const r=await api('DELETE','/cbd/productions/'+b.dataset.id);
      if(r.error){ toast('❌ '+r.error); return; }
      toast('🗑️ Supprimée'); chargerProductionsJour();
    };
  });
}

// ════════════════════════════════════════════════════════════
// ÉCRAN — ATELIERS (responsable)
// ════════════════════════════════════════════════════════════
async function renderAteliers(){
  $('content').innerHTML=`
    <div class="card">
      <h3>🏭 Ateliers de production
        <button class="btn btn-sm" id="at-add">➕ Ajouter</button>
      </h3>
      <div class="small muted" style="margin-bottom:10px">L'ordre définit le flux. « Pochons / unité » = combien de pochons vaut 1 unité de l'atelier (Lots de 5 = 5) — sert au calcul des en-cours.</div>
      <div id="at-body"><div class="loading">Chargement…</div></div>
    </div>`;
  $('at-add').onclick=()=>formAtelier(null);
  chargerAteliers();
}
async function chargerAteliers(){
  const body=$('at-body'); body.innerHTML='<div class="loading">Chargement…</div>';
  const d=await api('GET','/cbd/ateliers');
  if (d.error){ body.innerHTML='<div class="empty">❌ '+esc(d.error)+'</div>'; return; }
  const ats=d.ateliers||[];
  if (!ats.length){ body.innerHTML='<div class="empty">Aucun atelier. Clique « Ajouter ».</div>'; return; }
  const head=`<tr><th>Ordre</th><th>Nom</th><th>Unité</th><th>Pochons/unité</th><th>Objectif/j</th><th>Vrac</th><th>Actif</th><th></th></tr>`;
  const rows=ats.map(a=>`<tr>
    <td>${a.ordre}</td>
    <td><b>${esc(a.nom)}</b></td>
    <td>${esc(a.unite||'')}</td>
    <td>${a.unites_base}</td>
    <td>${a.cible_jour!=null?a.cible_jour:'—'}</td>
    <td>${a.consomme_vrac?'🛢️ oui':'—'}</td>
    <td>${a.actif?'✅':'⛔'}</td>
    <td style="white-space:nowrap">
      <button class="btn-icon at-edit" data-id="${a.id}" title="Modifier">✏️</button>
      <button class="btn-icon at-del" data-id="${a.id}" title="Supprimer">🗑️</button>
    </td>
  </tr>`).join('');
  body.innerHTML=`<div class="table-wrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  body.querySelectorAll('.at-edit').forEach(b=>b.onclick=()=>formAtelier(ats.find(x=>x.id===b.dataset.id)));
  body.querySelectorAll('.at-del').forEach(b=>b.onclick=()=>supprimerAtelier(b.dataset.id));
}
function formAtelier(a){
  const e=a||{ nom:'', ordre:'', unite:'pochon', unites_base:1, cible_jour:'', consomme_vrac:false, actif:true };
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">
    <h3>${a?'Modifier':'Nouvel'} atelier</h3>
    <label>Nom</label><input id="m-nom" class="fld" value="${esc(e.nom)}" placeholder="ex. Perçage & étiquetage">
    <div class="row">
      <div class="col"><label>Ordre</label><input id="m-ordre" class="fld" type="number" inputmode="numeric" value="${e.ordre}"></div>
      <div class="col"><label>Unité</label><input id="m-unite" class="fld" value="${esc(e.unite)}" placeholder="pochon, pack…"></div>
    </div>
    <div class="row">
      <div class="col"><label>Pochons / unité</label><input id="m-base" class="fld" type="number" min="1" inputmode="numeric" value="${e.unites_base}"></div>
      <div class="col"><label>Objectif / jour (optionnel)</label><input id="m-cible" class="fld" type="number" min="0" inputmode="numeric" value="${e.cible_jour!=null?e.cible_jour:''}"></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:14px;cursor:pointer"><input id="m-vrac" type="checkbox" ${e.consomme_vrac?'checked':''} style="width:18px;height:18px"> Consomme du vrac (atelier de pesée)</label>
    <label style="display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer"><input id="m-actif" type="checkbox" ${e.actif?'checked':''} style="width:18px;height:18px"> Actif</label>
    <div class="modal-actions">
      <button class="btn-ghost" id="m-cancel">Annuler</button>
      <button class="btn" id="m-save">${a?'Enregistrer':'Créer'}</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#m-cancel').onclick=()=>bg.remove();
  bg.onclick=ev=>{ if(ev.target===bg) bg.remove(); };
  bg.querySelector('#m-save').onclick=async ()=>{
    const nom=bg.querySelector('#m-nom').value.trim();
    if(!nom){ toast('❌ Nom requis'); return; }
    const body={
      nom,
      ordre: num(bg.querySelector('#m-ordre').value,0),
      unite: bg.querySelector('#m-unite').value.trim()||'pochon',
      unites_base: num(bg.querySelector('#m-base').value,1),
      cible_jour: bg.querySelector('#m-cible').value===''?null:num(bg.querySelector('#m-cible').value),
      consomme_vrac: bg.querySelector('#m-vrac').checked,
      actif: bg.querySelector('#m-actif').checked
    };
    const save=bg.querySelector('#m-save'); save.textContent='…'; save.disabled=true;
    const r = a ? await api('PATCH','/cbd/ateliers/'+a.id,body) : await api('POST','/cbd/ateliers',body);
    if(r.error){ save.disabled=false; save.textContent=a?'Enregistrer':'Créer'; toast('❌ '+r.error); return; }
    bg.remove(); toast(a?'✅ Atelier modifié':'✅ Atelier créé'); chargerAteliers();
  };
}
async function supprimerAtelier(id){
  if(!confirm('Supprimer cet atelier ?\n(impossible s\'il a des productions — désactive-le plutôt)')) return;
  const r=await api('DELETE','/cbd/ateliers/'+id);
  if(r.error){ toast('❌ '+r.error); return; }
  toast('🗑️ Atelier supprimé'); chargerAteliers();
}

// ── Changement de mot de passe (self-service) ──
function formMotDePasse(){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">
    <h3>🔑 Changer mon mot de passe</h3>
    <label>Mot de passe actuel</label><input id="mp-old" class="fld" type="password" autocomplete="current-password">
    <label>Nouveau mot de passe</label><input id="mp-new" class="fld" type="password" autocomplete="new-password" placeholder="6 caractères minimum">
    <label>Confirmer le nouveau</label><input id="mp-new2" class="fld" type="password" autocomplete="new-password">
    <div class="err" id="mp-err"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="mp-cancel">Annuler</button>
      <button class="btn" id="mp-save">Enregistrer</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector('#mp-cancel').onclick=close;
  bg.onclick=ev=>{ if(ev.target===bg) close(); };
  bg.querySelector('#mp-save').onclick=async ()=>{
    const ancien=bg.querySelector('#mp-old').value, nouveau=bg.querySelector('#mp-new').value, conf=bg.querySelector('#mp-new2').value;
    const err=bg.querySelector('#mp-err');
    if(!ancien||!nouveau){ err.textContent='Tous les champs sont requis'; return; }
    if(nouveau.length<6){ err.textContent='Le nouveau mot de passe doit faire au moins 6 caractères'; return; }
    if(nouveau!==conf){ err.textContent='Les deux nouveaux mots de passe ne correspondent pas'; return; }
    const save=bg.querySelector('#mp-save'); save.textContent='…'; save.disabled=true; err.textContent='';
    const r=await api('POST','/auth/change-password',{ancien,nouveau});
    if(r.error){ save.disabled=false; save.textContent='Enregistrer'; err.textContent='❌ '+r.error; return; }
    close(); toast('✅ Mot de passe modifié');
  };
}

</script>
